# Project Configuration
project:
  name: "ChronoTrace"
  version: "0.1.0"
  
# Paths
paths:
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  models_dir: "models"
  
# LoRA Training
lora:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules: ["query", "value"]
  batch_size: 32
  learning_rate: 2e-4
  num_epochs: 3
  max_length: 128
  
# Generic Classifier
classifier:
  max_depth: 5
  min_samples_split: 10
  min_samples_leaf: 5
  
# Temporal Graph
graph:
  similarity_threshold: 0.3
  mutation_threshold: 0.7